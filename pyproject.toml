[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ps2-autopilot"
version = "0.9.1"
description = "Multi-game autonomous PCSX2 gameplay framework for unattended livestreams."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ProhibitedTV"}]
dependencies = [
  "mss>=10.0.0",
  "numpy>=2.0.0",
  "opencv-python>=4.10.0.84,<5",
  "pywin32>=308; platform_system == 'Windows'",
  "pydirectinput>=1.0.4; platform_system == 'Windows'",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
virtual-gamepad = ["vgamepad>=0.1.0; platform_system == 'Windows'"]
ocr = [
  "rapidocr-onnxruntime>=1.4.4,<2; python_version < '3.13'",
]
full = [
  "vgamepad>=0.1.0; platform_system == 'Windows'",
  "rapidocr-onnxruntime>=1.4.4,<2; python_version < '3.13'",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ps2-autopilot = "ps2_autopilot.cli:main"
ps2-autopilot-capture = "ps2_autopilot.capture_cli:main"
ps2-autopilot-doctor = "ps2_autopilot.doctor:main"
ps2-autopilot-log = "ps2_autopilot.runtime_cli:log_main"
ps2-autopilot-report = "ps2_autopilot.runtime_cli:report_main"
ps2-autopilot-soak-report = "ps2_autopilot.soak_report:main"
ps2-autopilot-madden-acceptance = "ps2_autopilot.madden_acceptance:main"
ps2-autopilot-pine = "ps2_autopilot.pine_cli:main"
ps2-autopilot-jak-report = "ps2_autopilot.jak_benchmark:main"
ps2-autopilot-jak-graduation = "ps2_autopilot.jak_graduation:main"
ps2-autopilot-jak-curriculum = "ps2_autopilot.jak_curriculum:main"
ps2-autopilot-jak-semantic-check = "ps2_autopilot.jak_semantic_validation:main"
ps2-autopilot-jak-route = "ps2_autopilot.jak_route_calibration:main"
ps2-autopilot-jak-acceptance = "ps2_autopilot.jak_acceptance:main"
ps2-autopilot-jak-captures = "ps2_autopilot.jak_capture_suite:main"
ps2-autopilot-jak-contact = "ps2_autopilot.jak_contact_probe:main"
ps2-autopilot-jak-validation = "ps2_autopilot.jak_validation_workspace:main"
ps2-autopilot-supervisor = "ps2_autopilot.supervisor_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100