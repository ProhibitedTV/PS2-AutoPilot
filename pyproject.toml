[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ps2-autopilot"
version = "0.2.0"
description = "Autonomous PCSX2 gameplay framework for unattended livestreams."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ProhibitedTV"}]
dependencies = [
  "mss>=10.0.0",
  "numpy>=2.0.0",
  "opencv-python>=4.10.0.84",
  "pywin32>=308; platform_system == 'Windows'",
  "pydirectinput>=1.0.4; platform_system == 'Windows'",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
virtual-gamepad = ["vgamepad>=0.1.0; platform_system == 'Windows'"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ps2-autopilot = "ps2_autopilot.cli:main"
ps2-autopilot-capture = "ps2_autopilot.capture_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
