<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jak and Daxter Adventure Feed</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Inter,Arial,sans-serif}#card{position:absolute;left:28px;bottom:28px;min-width:500px;max-width:760px;border:1px solid rgba(255,255,255,.16);border-radius:16px;background:rgba(5,12,16,.87);box-shadow:0 16px 44px rgba(0,0,0,.35);overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(255,255,255,.055);font-size:11px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase}.body{padding:14px 15px 15px}.row{display:flex;gap:16px;align-items:flex-end;justify-content:space-between}.phase{font-size:25px;font-weight:950;letter-spacing:.5px}.mode{font-size:11px;letter-spacing:1px;color:#bed1da;text-transform:uppercase}.sub{margin-top:5px;color:#b7c4cc;font-size:12px}.intent{display:none;margin-top:10px;padding:8px 10px;border:1px solid rgba(255,255,255,.13);border-radius:9px;background:rgba(255,255,255,.055);font-size:11px;font-weight:850;letter-spacing:.35px}.intent.on{display:block}.progress{display:flex;gap:9px;margin-top:12px}.pill{display:flex;gap:7px;align-items:center;padding:6px 9px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.05);font-size:11px;font-weight:850}.pill span:first-child{color:#aebac1}.pill.unknown{display:none}.toast{margin-top:10px;font-size:11px;color:#d4e2e8;opacity:.88}.debug{display:none;margin-top:11px;padding-top:9px;border-top:1px solid rgba(255,255,255,.12);font:11px/1.45 Consolas,monospace;color:#9bdcff;white-space:pre-wrap}.debug.on{display:block}.offline{opacity:.55}
</style>
</head>
<body><section id="card"><div class="top"><span id="brand">Jak and Daxter · Adventure Feed</span><span id="status">LIVE</span></div><div class="body"><div class="row"><div><div class="phase" id="phase">ADVENTURE</div><div class="sub" id="sub">The Precursor Legacy</div></div><div class="mode" id="mode"></div></div><div class="intent" id="intent"></div><div class="progress"><div class="pill unknown" id="cells"><span>CELLS</span><b>—</b></div><div class="pill unknown" id="orbs"><span>ORBS</span><b>—</b></div><div class="pill unknown" id="flies"><span>FLIES</span><b>—</b></div></div><div class="toast" id="toast"></div><div class="debug" id="debug"></div></div></section>
<script>
(()=>{const q=new URLSearchParams(location.search),dbg=q.get('debug')==='1';const $=id=>document.getElementById(id);function clean(v){return String(v||'').replaceAll('_',' ').toUpperCase()}function count(id,v){const e=$(id);const known=v!==null&&v!==undefined&&v!=='';e.classList.toggle('unknown',!known);if(known)e.querySelector('b').textContent=v}function intentText(s){const skill=String(s.jak_skill||'none'),cue=String(s.jak_gameplay_cue||'none'),a=String(s.action||'');if(skill==='scout_dive')return 'TARGET · SCOUT FLY BOX · DIVE ATTACK';if(skill==='roll_jump')return 'TRAVERSAL · ROLL JUMP';if(cue==='blue_eco')return 'TARGET · BLUE ECO';if(a.includes('obstacle escape'))return 'RECOVERY · ESCAPING OBSTACLE';if(a.includes('WATER'))return 'SAFETY · SHORELINE AVOIDANCE';if(a.includes('spin-clear'))return 'COMBAT / BREAKABLE CLEAR';return ''}function update(s){const running=String(s.status||'').toLowerCase()==='running';$('card').classList.toggle('offline',!running);$('status').textContent=running?'LIVE':clean(s.status||'offline');$('brand').textContent=`${s.game_display_name||'Jak and Daxter'} · Adventure Feed`;const phase=clean(s.jak_phase||s.game_phase||'adventure');const cm=clean(s.jak_control_mode||'');$('phase').textContent=phase==='UNKNOWN'?'ADVENTURE':phase;$('mode').textContent=cm&&cm!=='UNKNOWN'?`${cm} · ${clean(s.jak_policy_version||'')}`:clean(s.jak_policy_version||'');$('sub').textContent=phase==='CUTSCENE'?'Story presentation':phase==='GAMEPLAY'?(cm==='ZOOMER'?'A-Grav run':cm==='FLUT FLUT'?'Flut Flut traversal':cm==='CANNON'?'Cannon challenge':cm==='FISHING'?'Fishing challenge':'Exploring the world'):phase==='DEATH'?'Checkpoint recovery':phase==='MENU'?'Preparing adventure':'The Precursor Legacy';const it=intentText(s);$('intent').classList.toggle('on',!!it);$('intent').textContent=it;count('cells',s.jak_power_cells);count('orbs',s.jak_precursor_orbs);count('flies',s.jak_scout_flies);const a=String(s.action||'');$('toast').textContent=a.includes('progress probe')?'Updating adventure progress…':a.includes('Scout Fly')?'Scout Fly box spotted. Setting up the dive…':a.includes('Blue Eco')?'Blue Eco spotted. Moving in…':a.includes('roll-jump')?'Using Jak movement tech…':a.includes('obstacle escape')?'Blocked route. Trying another angle…':a.includes('visual loop')?'Exploring a new direction…':'';if(dbg){$('debug').classList.add('on');$('debug').textContent=`policy=${s.jak_policy_version||'—'} mode=${s.jak_mode||'—'} control=${s.jak_control_mode||'—'}\ncue=${s.jak_gameplay_cue||'—'} conf=${s.jak_cue_confidence??'—'} x=${s.jak_cue_x??'—'} skill=${s.jak_skill||'—'}:${s.jak_skill_stage||'—'}\nwater=${s.jak_water_candidate_ratio??'—'} geom=${s.jak_water_geometry_confirmed??'—'} stuck=${s.jak_local_stuck_stage||'—'}\naction=${s.action||'—'} recoveries=${s.recoveries??0} rollJumps=${s.jak_roll_jump_attempts??0} scoutDives=${s.jak_scout_dive_attempts??0}`}}let busy=false;async function refresh(){if(busy)return;busy=true;try{const r=await fetch(`/state.json?_=${Date.now()}`,{cache:'no-store'});if(r.ok)update(await r.json())}catch(_){ }finally{busy=false}}setInterval(refresh,500);refresh()})();
</script></body></html>
