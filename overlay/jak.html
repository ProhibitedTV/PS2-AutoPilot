<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jak and Daxter Adventure Feed</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Inter,Arial,sans-serif}#card{position:absolute;left:28px;bottom:28px;min-width:430px;max-width:680px;border:1px solid rgba(255,255,255,.17);border-radius:16px;background:rgba(5,12,16,.88);box-shadow:0 16px 44px rgba(0,0,0,.35);overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(255,255,255,.06);font-size:11px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase}.body{padding:15px}.phase{font-size:25px;font-weight:950;letter-spacing:.5px}.sub{margin-top:6px;color:#b7c4cc;font-size:12px}.debug{display:none;margin-top:11px;padding-top:9px;border-top:1px solid rgba(255,255,255,.12);font:11px/1.45 Consolas,monospace;color:#9bdcff}.debug.on{display:block}.offline{opacity:.55}
</style>
</head>
<body><section id="card"><div class="top"><span id="brand">Jak and Daxter · Adventure Feed</span><span id="status">LIVE</span></div><div class="body"><div class="phase" id="phase">ADVENTURE</div><div class="sub" id="sub">The Precursor Legacy</div><div class="debug" id="debug"></div></div></section>
<script>
(()=>{const q=new URLSearchParams(location.search),dbg=q.get('debug')==='1';const $=id=>document.getElementById(id);function clean(v){return String(v||'').replaceAll('_',' ').toUpperCase()}function update(s){const running=String(s.status||'').toLowerCase()==='running';$('card').classList.toggle('offline',!running);$('status').textContent=running?'LIVE':clean(s.status||'offline');$('brand').textContent=`${s.game_display_name||'Jak and Daxter'} · Adventure Feed`;const phase=clean(s.jak_phase||s.game_phase||'adventure');$('phase').textContent=phase==='UNKNOWN'?'ADVENTURE':phase;$('sub').textContent=phase==='CUTSCENE'?'Story presentation':phase==='GAMEPLAY'?'Exploring the world':phase==='DEATH'?'Checkpoint recovery':phase==='MENU'?'Preparing adventure':'The Precursor Legacy';if(dbg){$('debug').classList.add('on');$('debug').textContent=`mode=${s.jak_mode||'—'} template=${s.jak_template||'—'} score=${s.jak_template_score??'—'} motion=${s.jak_motion??'—'} action=${s.action||'—'} recoveries=${s.recoveries??0}`}}let busy=false;async function refresh(){if(busy)return;busy=true;try{const r=await fetch(`/state.json?_=${Date.now()}`,{cache:'no-store'});if(r.ok)update(await r.json())}catch(_){ }finally{busy=false}}setInterval(refresh,500);refresh()})();
</script></body></html>
