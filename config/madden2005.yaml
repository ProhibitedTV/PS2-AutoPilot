window_title_contains: "PCSX2"
loop_hz: 12

# Keep computer-vision helpers bounded so PCSX2 and OBS remain the priority
# realtime workloads. Two OpenCV worker threads is deliberately conservative.
performance:
  opencv_threads: 2

controller:
  backend: virtual_gamepad
  focus_window: true

watchdog:
  motion_threshold: 0.008
  stuck_seconds: 25
  recovery_cooldown_seconds: 8
  reload_savestate_after_recoveries: 4
  load_state_key: "f3"

overlay:
  enabled: true
  host: "127.0.0.1"
  port: 8765
  # OBS does not need a fresh state file for every 12 Hz control tick.
  state_hz: 2.0

runtime_retention:
  max_total_mb: 300
  max_failure_bundles: 30
  max_unknown_captures: 60
  prune_interval_seconds: 60

observability:
  enabled: true
  console: true
  verbose_console: true
  heartbeat_seconds: 5.0
  verbose_log_seconds: 1.0
  spatial_log_seconds: 0.75
  spatial_console_seconds: 2.0
  history_size: 240
  input_history_size: 300
  max_log_bytes: 8000000
  failure_bundle_cooldown_seconds: 8.0
  max_failure_bundles: 30
  stick_log_interval_seconds: 0.50
  stick_log_delta: 0.08

profile:
  name: madden2005
  template_threshold: 0.84
  field_green_threshold: 0.20
  live_motion_threshold: 0.020
  phase_stability_seconds: 0.18
  live_hold_seconds: 0.55
  snap_causality_seconds: 1.55
  pre_snap_wait_seconds: 1.15
  menu_action_seconds: 1.05
  playcall_action_seconds: 0.95
  kick_power_seconds: 0.72
  kick_accuracy_seconds: 0.34
  aggression: 0.68
  steering_wander: 0.24

  play_clock_urgent_seconds: 8
  pre_snap_failsafe_seconds: 5.0
  pre_snap_probe_interval_seconds: 1.15
  pre_snap_max_failsafe_probes: 3
  playcall_role_fresh_seconds: 18.0

  final_zero_clock_confirm_seconds: 0.75
  final_presentation_hold_seconds: 12.0

  pass_read_min_seconds: 1.10
  pass_read_max_seconds: 2.05

  presentation_hold_seconds: 8.0
  event_presentation_hold_seconds: 12.0
  presentation_stall_nudge_seconds: 30.0
  presentation_hard_recovery_seconds: 55.0

  spatial_interval_seconds: 0.25
  spatial_sample_width: 480
  spatial_player_min_confidence: 0.30
  spatial_max_players: 22
  spatial_track_ttl_seconds: 0.90
  spatial_ball_ttl_seconds: 0.70
  spatial_target_confidence: 0.50
  spatial_controlled_confidence: 0.48
  spatial_open_confidence: 0.42
  spatial_max_age_seconds: 0.70

  # v0.7.0: do one synchronous OCR bootstrap so startup/menu navigation remains
  # safe, then move recurring RapidOCR inference onto a single latest-frame worker.
  # The worker queue is bounded to one pending frame; stale work is replaced rather
  # than accumulating behind PCSX2/OBS/controller timing.
  ocr_enabled: true
  ocr_interval_seconds: 0.85
  ocr_min_width: 960
  ocr_max_width: 1280
  ocr_min_confidence: 0.42
  ocr_intra_op_num_threads: 2
  ocr_inter_op_num_threads: 1
  ocr_use_orientation_classifier: false
  ocr_async_enabled: true
  ocr_bootstrap_sync: true

  # High-confidence spatial distance can suppress low-value defensive contact
  # moves while the controlled defender is still clearly far from the target.
  defense_contact_distance: 0.34
  defense_far_action_delay_seconds: 0.28

  # v0.7.2: do not accept Madden's remembered/default matchup every game. The
  # captured team-select layout starts on HOME; bounded UP/DOWN steps rotate home,
  # LEFT changes focus to AWAY, then bounded UP/DOWN steps rotate away. L1/R1 are
  # intentionally excluded so Historic Teams are never entered autonomously.
  team_rotation_enabled: true
  team_rotation_min_steps: 1
  team_rotation_max_steps: 6
  team_rotation_action_seconds: 0.42
  team_rotation_settle_seconds: 1.10

  unknown_capture_seconds: 3.0
  unknown_capture_cooldown_seconds: 20.0
  max_unknown_captures: 60
  max_event_log_bytes: 5000000
  menu_progress_timeout_seconds: 18.0
  paused_progress_timeout_seconds: 45.0
  playcall_progress_timeout_seconds: 24.0
  pre_snap_progress_timeout_seconds: 22.0
  post_play_progress_timeout_seconds: 45.0
  game_over_progress_timeout_seconds: 30.0
  progress_recovery_cooldown_seconds: 8.0
