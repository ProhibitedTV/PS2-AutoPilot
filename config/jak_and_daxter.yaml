window_title_contains: "PCSX2"
loop_hz: 12

performance:
  opencv_threads: 2

controller:
  backend: virtual_gamepad
  focus_window: true

semantic_telemetry:
  enabled: true
  host: "127.0.0.1"
  port: 28011
  timeout_seconds: 0.50
  interval_seconds: 0.25
  identity_interval_seconds: 5.0
  retry_interval_seconds: 2.0
  schema_retry_interval_seconds: 10.0
  expected_title_contains: "Jak and Daxter"
  expected_game_ids: []
  expected_crcs: []
  auto_jak1_symbols: true
  fields: {}

watchdog:
  motion_threshold: 0.006
  stuck_seconds: 25
  recovery_cooldown_seconds: 10
  reload_savestate_after_recoveries: 999999
  load_state_key: "f3"

overlay:
  enabled: true
  host: "127.0.0.1"
  port: 8765
  state_hz: 2.0
  index_file: "jak.html"

runtime_retention:
  max_total_mb: 300
  max_failure_bundles: 30
  max_unknown_captures: 60
  prune_interval_seconds: 60

observability:
  enabled: true
  console: true
  verbose_console: true
  heartbeat_seconds: 5.0
  verbose_log_seconds: 1.0
  spatial_log_seconds: 0.75
  spatial_console_seconds: 2.0
  history_size: 240
  input_history_size: 300
  max_log_bytes: 8000000
  failure_bundle_cooldown_seconds: 8.0
  max_failure_bundles: 30
  stick_log_interval_seconds: 0.50
  stick_log_delta: 0.08

profile:
  name: jak_and_daxter
  mode: production
  template_threshold: 0.84
  random_seed: 2001
  production_random_seed: 2001

  # Tutorial curriculum remains the first benchmark, but V16 no longer lets the
  # sequential plan hide legitimate rewards or keep Jak pinned to one false target.
  geyser_baseline_power_cells: 0
  geyser_baseline_orbs: 0
  geyser_baseline_scout_flies: 0
  objective_replan_seconds: 45
  objective_replan_scan_seconds: 7
  position_bucket_size: 3.0
  geyser_waypoints: []

  ocr_enabled: true
  ocr_interval_seconds: 0.85
  ocr_min_width: 960
  ocr_max_width: 1280
  ocr_min_confidence: 0.42
  ocr_intra_threads: 2
  ocr_inter_threads: 1
  title_start_retry_seconds: 3.0
  main_menu_retry_seconds: 3.0
  new_game_green_ratio_threshold: 0.04
  new_game_green_margin: 0.012
  main_menu_ocr_quorum: 3
