window_title_contains: "PCSX2"
loop_hz: 12

performance:
  opencv_threads: 2

controller:
  backend: virtual_gamepad
  focus_window: true

# Jak recovery stays conservative. V9+ handles short local stalls inside proven
# gameplay; the global watchdog remains the slow last-resort recovery ladder.
watchdog:
  motion_threshold: 0.006
  stuck_seconds: 25
  recovery_cooldown_seconds: 10
  reload_savestate_after_recoveries: 999999
  load_state_key: "f3"

overlay:
  enabled: true
  host: "127.0.0.1"
  port: 8765
  state_hz: 2.0
  index_file: "jak.html"

runtime_retention:
  max_total_mb: 300
  max_failure_bundles: 30
  max_unknown_captures: 60
  prune_interval_seconds: 60

observability:
  enabled: true
  console: true
  verbose_console: true
  heartbeat_seconds: 5.0
  verbose_log_seconds: 1.0
  spatial_log_seconds: 0.75
  spatial_console_seconds: 2.0
  history_size: 240
  input_history_size: 300
  max_log_bytes: 8000000
  failure_bundle_cooldown_seconds: 8.0
  max_failure_bundles: 30
  stick_log_interval_seconds: 0.50
  stick_log_delta: 0.08

profile:
  name: jak_and_daxter

  # V10 keeps V9's closed-loop safety, then adds recognizable game-specific skills:
  # Scout Fly dive attacks, Blue Eco seeking, moving spin clears, and guarded roll jumps.
  mode: production
  template_threshold: 0.84
  random_seed: 2001
  production_random_seed: 2001

  ocr_enabled: true
  ocr_interval_seconds: 0.85
  ocr_min_width: 960
  ocr_max_width: 1280
  ocr_min_confidence: 0.42
  ocr_intra_threads: 2
  ocr_inter_threads: 1
  title_start_retry_seconds: 3.0
  main_menu_retry_seconds: 3.0
  new_game_green_ratio_threshold: 0.04
  new_game_green_margin: 0.012

  # V4 real-capture main-menu fallback. V8+ restricts visual-only use to pre-gameplay
  # boot states; after gameplay has been established, a real menu needs OCR evidence.
  main_menu_ocr_quorum: 3
  main_menu_visual_green_threshold: 0.12
  main_menu_visual_competing_max: 0.035
  main_menu_visual_margin: 0.08
  main_menu_visual_stable_motion: 0.02

  # First-run Jak save creation defaults to NO. Strong OCR must establish a non-
  # destructive save/create/overwrite prompt before this transaction is allowed.
  save_choice_green_threshold: 0.06
  save_choice_green_margin: 0.04
  save_prompt_select_settle_seconds: 0.30
  save_prompt_retry_seconds: 4.0

  # V5/V6 save-file selector. OCR remains the preferred evidence path. If OCR misses
  # the stylized title/EMPTY text, V6 accepts only the stable real-menu geometry.
  save_file_retry_seconds: 4.0
  save_selector_visual_stable_motion: 0.008
  save_selector_visual_title_white: 0.16
  save_selector_visual_title_edge: 0.04
  save_selector_visual_row_white: 0.08
  save_selector_visual_row_edge: 0.025
  save_selector_visual_continue_white: 0.04
  save_selector_visual_continue_edge: 0.03

  opening_cinematic_hold_seconds: 390
  opening_gameplay_motion_threshold: 0.012
  gameplay_grace_seconds: 8.0

  scene_memory_sample_seconds: 1.25
  scene_memory_history: 48
  loop_similarity_threshold: 0.94
  stagnant_motion_threshold: 0.008

  production_forward: 0.70
  production_turn: 0.52
  production_camera: 0.22
  production_burst_min_seconds: 0.75
  production_burst_max_seconds: 1.45
  production_jump_probability: 0.18
  double_jump_probability: 0.65

  safe_forward_scale: 0.82
  safe_jump_scale: 0.55

  # Water color is only a candidate cue; V9 geometry must confirm a coherent surface.
  water_hue_min: 85
  water_hue_max: 140
  water_sat_min: 45
  water_value_min: 25
  water_center_caution: 0.09
  water_total_caution: 0.11
  water_release_ratio: 0.045
  water_clear_seconds: 0.65
  water_backtrack_seconds: 1.6
  water_turn_seconds: 1.4
  water_backtrack_speed: 0.72
  water_escape_turn: 0.82
  water_escape_forward: 0.28

  water_geometry_max_width: 480
  water_component_min_ratio: 0.020
  water_component_min_width: 0.18
  water_component_min_coherence: 0.16
  water_row_coverage_threshold: 0.30
  water_row_max_threshold: 0.42
  water_row_band_min_fraction: 0.04
  water_risk_confirmations_required: 2
  water_direction_reconsider_seconds: 1.75
  water_direction_flip_margin: 0.10

  attach_probe_after_seconds: 4.0
  attach_probe_idle_seconds: 0.8
  attach_probe_baseline_max: 0.020
  attach_probe_response_min: 0.018
  attach_probe_camera_x: 0.30
  attach_probe_drive_seconds: 0.30
  attach_probe_observe_seconds: 0.80
  attach_probe_retry_seconds: 1.5
  attach_probe_confirmations_required: 2

  reacquire_after_seconds: 2.0
  reacquire_confirmations_required: 1
  post_reacquire_escape_seconds: 1.35
  post_reacquire_back_speed: 0.64
  post_reacquire_turn: 0.60
  post_reacquire_camera: 0.32

  # Fast local obstacle/contact recovery from V9.
  local_stuck_motion_threshold: 0.0035
  local_stuck_trigger_seconds: 2.2
  local_stuck_command_warmup_seconds: 0.55
  local_stuck_reverse_seconds: 0.70
  local_stuck_pivot_seconds: 0.80
  local_stuck_test_seconds: 1.15
  local_stuck_reverse_speed: 0.62
  local_stuck_pivot_turn: 0.86
  local_stuck_camera_turn: 0.38
  local_stuck_test_forward: 0.58
  local_stuck_success_motion: 0.010
  local_stuck_success_seconds: 0.30
  local_stuck_max_nonjump_attempts: 2
  local_stuck_jump_turn_seconds: 0.75
  local_stuck_cooldown_seconds: 1.4
  local_stuck_route_memory_seconds: 5.5

  # V10 Scout Fly box cue. Boxes are red/gray and require a jump+dive attack.
  scout_red_sat_min: 90
  scout_red_value_min: 55
  scout_gray_value_min: 85
  scout_gray_sat_max: 105
  scout_min_area: 0.0010
  scout_max_area: 0.045
  scout_gray_neighbor_min: 0.10
  scout_cue_min_confidence: 0.42
  scout_approach_seconds: 0.55
  scout_jump_lead_seconds: 0.18
  scout_follow_seconds: 0.34

  # V10 Blue Eco cue. Only acts when V9 says the blue pixels are not coherent water.
  blue_eco_hue_min: 88
  blue_eco_hue_max: 118
  blue_eco_sat_min: 95
  blue_eco_value_min: 150
  blue_eco_white_value_min: 205
  blue_eco_white_sat_max: 80
  blue_eco_min_area: 0.0008
  blue_eco_max_area: 0.075
  blue_eco_white_neighbor_min: 0.010
  blue_eco_cue_min_confidence: 0.38
  blue_eco_seek_seconds: 0.72
  blue_eco_seek_forward: 0.54
  cue_refresh_seconds: 0.16
  cue_turn_gain: 0.90

  # V10 action vocabulary. Spin is low-risk while moving; roll-jumps only happen on
  # stable, dry, mostly straight travel and remain subordinate to all recovery layers.
  spin_attack_min_seconds: 1.6
  spin_attack_max_seconds: 3.2
  roll_jump_min_seconds: 5.0
  roll_jump_max_seconds: 9.0
  roll_jump_motion_min: 0.012
  roll_jump_water_max: 0.055
  roll_jump_heading_max: 0.20
  roll_jump_roll_seconds: 0.14
  roll_jump_air_seconds: 0.48

  # R2 exposes the game's normal progress HUD. OCR keeps monotonic collectible totals.
  progress_probe_initial_delay_seconds: 20
  progress_probe_seconds: 120
  progress_probe_hold_seconds: 1.25

  # Legacy explore-mode tuning is retained for explicit calibration runs.
  menu_action_seconds: 1.4
  death_action_seconds: 1.5
  explore_burst_min_seconds: 0.8
  explore_burst_max_seconds: 1.8
  explore_forward: 0.82
  explore_turn: 0.28
  camera_turn: 0.18
  jump_probability: 0.08
