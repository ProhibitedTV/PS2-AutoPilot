window_title_contains: "PCSX2"
loop_hz: 12

performance:
  opencv_threads: 2

controller:
  backend: virtual_gamepad
  focus_window: true

# Jak recovery stays conservative. Active recovery only happens while gameplay
# owns the controller; unknown/static states remain evidence-first and fail closed.
watchdog:
  motion_threshold: 0.006
  stuck_seconds: 25
  recovery_cooldown_seconds: 10
  reload_savestate_after_recoveries: 999999
  load_state_key: "f3"

overlay:
  enabled: true
  host: "127.0.0.1"
  port: 8765
  state_hz: 2.0
  index_file: "jak.html"

runtime_retention:
  max_total_mb: 300
  max_failure_bundles: 30
  max_unknown_captures: 60
  prune_interval_seconds: 60

observability:
  enabled: true
  console: true
  verbose_console: true
  heartbeat_seconds: 5.0
  verbose_log_seconds: 1.0
  spatial_log_seconds: 0.75
  spatial_console_seconds: 2.0
  history_size: 240
  input_history_size: 300
  max_log_bytes: 8000000
  failure_bundle_cooldown_seconds: 8.0
  max_failure_bundles: 30
  stick_log_interval_seconds: 0.50
  stick_log_delta: 0.08

profile:
  name: jak_and_daxter

  # V7 keeps the real boot/save gates from V4-V6, then adds safer autonomous
  # traversal and a reversible camera-response probe so the runtime can reacquire an
  # already-running gameplay session after a supervised restart.
  mode: production
  template_threshold: 0.84
  random_seed: 2001
  production_random_seed: 2001

  ocr_enabled: true
  ocr_interval_seconds: 0.85
  ocr_min_width: 960
  ocr_max_width: 1280
  ocr_min_confidence: 0.42
  ocr_intra_threads: 2
  ocr_inter_threads: 1
  title_start_retry_seconds: 3.0
  main_menu_retry_seconds: 3.0
  new_game_green_ratio_threshold: 0.04
  new_game_green_margin: 0.012

  # V4 real-capture main-menu fallback. The selected NEW GAME row should contain a
  # strong lime-green text signal while LOAD GAME / OPTIONS / BACK remain neutral.
  main_menu_ocr_quorum: 3
  main_menu_visual_green_threshold: 0.12
  main_menu_visual_competing_max: 0.035
  main_menu_visual_margin: 0.08
  main_menu_visual_stable_motion: 0.02

  # First-run Jak save creation defaults to NO. Strong OCR must establish a non-
  # destructive save/create/overwrite prompt before this transaction is allowed.
  save_choice_green_threshold: 0.06
  save_choice_green_margin: 0.04
  save_prompt_select_settle_seconds: 0.30
  save_prompt_retry_seconds: 4.0

  # V5/V6 save-file selector. OCR remains the preferred evidence path. If OCR misses
  # the stylized title/EMPTY text, V6 accepts only the stable real-menu geometry.
  save_file_retry_seconds: 4.0
  save_selector_visual_stable_motion: 0.008
  save_selector_visual_title_white: 0.16
  save_selector_visual_title_edge: 0.04
  save_selector_visual_row_white: 0.08
  save_selector_visual_row_edge: 0.025
  save_selector_visual_continue_white: 0.04
  save_selector_visual_continue_edge: 0.03

  # The opening is presentation-heavy. The existing conservative handoff remains the
  # primary full-boot path.
  opening_cinematic_hold_seconds: 390
  opening_gameplay_motion_threshold: 0.012
  gameplay_grace_seconds: 8.0

  scene_memory_sample_seconds: 1.25
  scene_memory_history: 48
  loop_similarity_threshold: 0.94
  stagnant_motion_threshold: 0.008

  production_forward: 0.70
  production_turn: 0.52
  production_camera: 0.22
  production_burst_min_seconds: 0.75
  production_burst_max_seconds: 1.45
  production_jump_probability: 0.18
  double_jump_probability: 0.65

  # V7 land routing. Reduce the straight-ahead bias and jumping frequency while
  # autonomous perception is still coarse.
  safe_forward_scale: 0.82
  safe_jump_scale: 0.55

  # V7 shoreline/ocean guardrail. Ratios are measured only in the lower playfield,
  # split left/center/right. When blue/cyan water becomes dominant ahead, first
  # backtrack the route that got us there, then arc toward the drier side.
  water_hue_min: 85
  water_hue_max: 140
  water_sat_min: 45
  water_value_min: 25
  water_center_caution: 0.09
  water_total_caution: 0.11
  water_release_ratio: 0.045
  water_clear_seconds: 1.0
  water_backtrack_seconds: 1.6
  water_turn_seconds: 1.4
  water_backtrack_speed: 0.72
  water_escape_turn: 0.82
  water_escape_forward: 0.28

  # If AutoPilot itself is restarted while PCSX2 remains in gameplay, V7 does not
  # blindly claim the unknown screen. It waits for a relatively quiet frame, nudges
  # only the right stick, and requires two camera-motion responses before restoring
  # gameplay ownership. Menus/save screens remain blockers.
  attach_probe_after_seconds: 4.0
  attach_probe_idle_seconds: 0.8
  attach_probe_baseline_max: 0.020
  attach_probe_response_min: 0.018
  attach_probe_camera_x: 0.30
  attach_probe_drive_seconds: 0.30
  attach_probe_observe_seconds: 0.80
  attach_probe_retry_seconds: 1.5
  attach_probe_confirmations_required: 2

  # L2/R2 exposes the game's normal progress HUD. Probe it periodically and let OCR
  # retain monotonic Power Cell / Orb / Scout Fly totals as reward telemetry.
  progress_probe_initial_delay_seconds: 20
  progress_probe_seconds: 120
  progress_probe_hold_seconds: 1.25

  # Legacy explore-mode tuning is retained for explicit calibration runs.
  menu_action_seconds: 1.4
  death_action_seconds: 1.5
  explore_burst_min_seconds: 0.8
  explore_burst_max_seconds: 1.8
  explore_forward: 0.82
  explore_turn: 0.28
  camera_turn: 0.18
  jump_probability: 0.08
