window_title_contains: "PCSX2"
loop_hz: 60

performance:
  opencv_threads: 2
  template_matching_async: true
  template_scan_interval_seconds: 0.15
  template_result_max_age_seconds: 0.80

controller:
  backend: virtual_gamepad
  focus_window: true

# Guitar Hero legitimately has long static title/loading/result frames. Recovery is
# intentionally much slower than the action games; the profile also suppresses its
# own recovery inputs while presentation/gameplay owns the screen.
watchdog:
  motion_threshold: 0.0025
  stuck_seconds: 180
  recovery_cooldown_seconds: 30
  reload_savestate_after_recoveries: 99
  load_state_key: "f3"

overlay:
  enabled: true
  host: "127.0.0.1"
  port: 8765
  state_hz: 5.0

runtime_retention:
  max_total_mb: 400
  max_failure_bundles: 40
  max_unknown_captures: 100
  prune_interval_seconds: 60

observability:
  enabled: true
  console: true
  verbose_console: true
  heartbeat_seconds: 3.0
  verbose_log_seconds: 0.50
  spatial_log_seconds: 0.50
  spatial_console_seconds: 1.5
  history_size: 500
  input_history_size: 800
  max_log_bytes: 12000000
  failure_bundle_cooldown_seconds: 8.0
  max_failure_bundles: 40
  stick_log_interval_seconds: 0.20
  stick_log_delta: 0.05

profile:
  name: guitar_hero

  # Streaming route: boot/save -> Quick Play -> setlist -> difficulty -> song ->
  # results/failure -> next song. Keep Easy while live note timing is calibrated.
  difficulty: easy
  song_advance_after_completion: 1

  # GH1 remembers the last difficulty selection. Home the four-row poster to the top
  # before applying the configured target so a retained Medium/Hard/Expert selection
  # cannot silently override `difficulty: easy`.
  difficulty_home_presses: 3

  # Failed songs return to New Song during calibration. V10 reads the actual yellow
  # RETRY/NEW SONG/QUIT selection and moves it directly instead of relying on generic
  # frame-signature progress, which could strand an unattended stream on this card.
  failed_song_action: new_song
  failed_card_threshold: 0.72
  failed_menu_settle_seconds: 0.18
  failed_confirm_retry_seconds: 1.0
  failed_selection_tolerance: 0.052

  # Menu/presentation arbitration. Unknown moving screens are always preserved as
  # presentation; static loading after a launch is also input-silent.
  template_threshold: 0.82
  menu_stable_seconds: 0.45
  menu_input_settle_seconds: 0.22
  menu_progress_timeout_seconds: 1.25
  menu_progress_delta: 0.018
  presentation_motion_threshold: 0.018
  boot_prompt_seconds: 2.0
  boot_retry_seconds: 5.0
  boot_max_attempts: 4
  launch_wait_seconds: 35.0
  post_song_settle_seconds: 1.25
  post_song_confirm_limit: 4

  # Joint receptor geometry from V8 remains the spatial foundation. V10 adds a
  # temporal layer: a colored component must demonstrably approach the strike line
  # over multiple frames before it may fire. Observed approach velocity supplies a
  # bounded sub-frame lead to compensate capture/controller latency.
  vision_width: 640
  vision_height: 480
  gameplay_threshold: 0.64
  receptor_candidate_limit: 6
  receptor_joint_min_span: 0.18
  receptor_joint_max_span: 0.58
  receptor_joint_max_y_spread: 0.055
  receptor_lock_threshold: 0.80
  receptor_lock_frames: 3
  receptor_lock_match_radius: 0.045
  note_lookahead: 0.18
  note_trigger_gap: 0.030
  note_receptor_exclusion: 0.024
  note_lane_half_width: 0.032
  note_min_area: 7
  note_max_area: 1700
  approach_history_frames: 4
  approach_min_delta: 0.0015
  approach_backtrack_tolerance: 0.006
  approach_missing_grace_frames: 1
  timing_lead_frames: 0.80
  timing_trigger_max: 0.055

  # Easy only uses green/red/yellow; the active profile suppresses impossible lanes.
  # A slightly longer non-blocking hold gives PCSX2 two or three 60 Hz frames to
  # register each valid fret without turning taps into sustains.
  hit_threshold: 0.50
  hit_reset_threshold: 0.10
  tap_hold_seconds: 0.040
  rearm_seconds: 0.025
  sustain_height: 0.20
  sustain_half_width: 0.010
  sustain_min_run: 0.28
  sustain_grace_seconds: 0.070

  # Keep whammy and Star Power off until base note perception/timing is credible.
  whammy_enabled: false
  whammy_hz: 7.0
  star_power_enabled: false
  star_power_note_interval: 90
  star_power_min_seconds: 28.0
