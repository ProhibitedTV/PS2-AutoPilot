window_title_contains: "PCSX2"
loop_hz: 12

performance:
  opencv_threads: 2

controller:
  backend: virtual_gamepad
  focus_window: true

watchdog:
  motion_threshold: 0.006
  stuck_seconds: 18
  recovery_cooldown_seconds: 7
  reload_savestate_after_recoveries: 4
  load_state_key: "f3"

overlay:
  enabled: true
  host: "127.0.0.1"
  port: 8765
  state_hz: 3.0

runtime_retention:
  max_total_mb: 300
  max_failure_bundles: 30
  max_unknown_captures: 80
  prune_interval_seconds: 60

observability:
  enabled: true
  console: true
  verbose_console: true
  heartbeat_seconds: 4.0
  verbose_log_seconds: 0.75
  spatial_log_seconds: 0.50
  spatial_console_seconds: 1.5
  history_size: 300
  input_history_size: 400
  max_log_bytes: 8000000
  failure_bundle_cooldown_seconds: 8.0
  max_failure_bundles: 30
  stick_log_interval_seconds: 0.25
  stick_log_delta: 0.05

profile:
  name: nfs_hot_pursuit_2

  # V2 default: World Racing -> Quick Race. On PS2 this is a police-free quick
  # race and gives us randomized race/car variety without entering an event tree.
  # Other implemented routes: championship, hot_pursuit_quick_race,
  # ultimate_racer, be_the_cop.
  menu_route: world_racing_quick_race

  # Menu automation remains template-owned. Generic menu captures are recognized
  # only to hold ownership safely; directional inputs require selected-row labels.
  template_threshold: 0.84
  menu_action_seconds: 1.00
  results_hold_seconds: 5.0
  replay_hold_seconds: 8.0
  pause_resume_seconds: 1.5

  # Road perception / race entry.
  road_sample_width: 360
  road_color_distance: 42.0
  race_enter_confidence: 0.56
  drive_confidence: 0.34
  race_enter_frames: 5
  race_motion_threshold: 0.006
  road_loss_recovery_seconds: 2.2

  # Steering controller. Positive road center/curvature steers right.
  steering_gain: 1.05
  curvature_gain: 0.72
  steering_smoothing: 0.42
  max_steer: 0.95
  corner_brake_threshold: 0.84
  corner_brake_interval_seconds: 0.85

  # V2 oscillation and stuck-at-speed guards.
  oscillation_delta: 0.55
  oscillation_damping: 0.55
  stall_motion_threshold: 0.0025
  stall_seconds: 1.8

  # Default PS2 bindings for Hot Pursuit 2.
  accelerate_action: cross
  brake_action: square
  handbrake_action: r1

  # The PS2 manual exposes R1 emergency brake. V2 has a sharp-turn handbrake hook,
  # but keep it disabled until live track evidence proves it helps rather than spins.
  handbrake_enabled: false
  handbrake_threshold: 0.93
  handbrake_curvature: 0.20
  handbrake_interval_seconds: 1.25

  # PS2 You're The Cop: Circle siren/target, R3 boost, R2 roadblock/spike strip,
  # L2 helicopter. Support calls are opt-in until their availability HUD is captured.
  cop_siren_action: circle
  cop_boost_action: r3
  cop_roadblock_action: r2
  cop_helicopter_action: l2
  cop_boost_interval_seconds: 4.0
  cop_support_enabled: false
  cop_support_interval_seconds: 18.0

  # Bounded road-loss / wrong-way recovery transaction.
  recovery_reverse_seconds: 0.70
  recovery_forward_seconds: 0.85
