window_title_contains: "PCSX2"
loop_hz: 12

performance:
  opencv_threads: 2
  # Full-resolution matching across the local template library took ~600 ms in the
  # first live NFS session, reducing a nominal 12 Hz controller to ~1.5 Hz. Keep one
  # latest-frame scan off the control thread and reject results that become stale.
  template_matching_async: true
  template_scan_interval_seconds: 0.10
  template_result_max_age_seconds: 1.25

controller:
  backend: virtual_gamepad
  focus_window: true

watchdog:
  motion_threshold: 0.006
  stuck_seconds: 18
  recovery_cooldown_seconds: 7
  reload_savestate_after_recoveries: 4
  load_state_key: "f3"

overlay:
  enabled: true
  host: "127.0.0.1"
  port: 8765
  state_hz: 3.0

runtime_retention:
  max_total_mb: 300
  max_failure_bundles: 30
  max_unknown_captures: 80
  prune_interval_seconds: 60

observability:
  enabled: true
  console: true
  verbose_console: true
  heartbeat_seconds: 4.0
  verbose_log_seconds: 0.75
  spatial_log_seconds: 0.50
  spatial_console_seconds: 1.5
  history_size: 300
  input_history_size: 400
  max_log_bytes: 8000000
  failure_bundle_cooldown_seconds: 8.0
  max_failure_bundles: 30
  stick_log_interval_seconds: 0.25
  stick_log_delta: 0.05

profile:
  name: nfs_hot_pursuit_2

  # Default unattended route: World Racing -> Quick Race. Other implemented
  # targets: championship, hot_pursuit_quick_race, ultimate_racer, be_the_cop.
  menu_route: world_racing_quick_race

  # PS2-specific handling option selected in-game. The policy only changes its
  # controller gains; it does not blindly navigate Options to enforce the choice.
  handling_mode: classic
  extreme_steering_scale: 0.86
  extreme_curvature_scale: 0.90
  extreme_min_smoothing: 0.52

  # Stable selected-row evidence and progress-acknowledged menu transactions.
  template_threshold: 0.84
  menu_stability_frames: 2
  menu_action_seconds: 0.80
  menu_progress_timeout_seconds: 1.60
  menu_max_retries: 1
  menu_escape_takeover_seconds: 2.0

  # V6 24/7 bootstrap/reacquisition. Templates remain authoritative when present,
  # but UNKNOWN no longer means "do nothing forever". The ladder probes one PS2
  # input at a time and waits for visual progress before continuing.
  unattended_bootstrap_enabled: true
  bootstrap_stable_seconds: 1.25
  bootstrap_settle_seconds: 0.85
  bootstrap_progress_timeout_seconds: 2.0
  bootstrap_progress_delta: 0.028
  bootstrap_motion_guard: 0.035
  bootstrap_force_after_seconds: 7.0
  bootstrap_cycle_pause_seconds: 2.0
  bootstrap_sequence:
    - start
    - down
    - confirm
    - confirm
    - confirm
    - confirm

  # Live V6 takeover hardening. A road-like transition/car-preview frame cannot
  # claim gameplay while a bootstrap/menu input is still settling. Once gameplay is
  # provisionally claimed, keep bounded forward throttle while the chase-camera road
  # detector settles instead of immediately reversing on the first segmentation miss.
  fast_takeover_input_quiet_seconds: 1.50
  fast_takeover_probation_seconds: 1.50
  fast_takeover_min_motion: 0.010

  # V7 fixed-HUD gameplay ownership. Overnight evidence proved the race HUD remains
  # reliable even when the pavement detector is blind against a wall. Strong fixed
  # rank/lap/tach geometry can therefore keep the profile in gameplay ownership.
  hud_gameplay_enabled: true
  hud_gameplay_threshold: 0.82

  # V8 long-stall rescue. Short crashes still use reverse/forward recovery. Only a
  # strong HUD-owned stall with poor road vision, near-zero motion, four failed
  # recovery attempts and at least 28 seconds of persistence may invoke the documented
  # Pause Menu -> Restart Race fallback. This prevents another eight-hour wall park.
  hud_stall_motion_threshold: 0.0035
  hud_stall_reset_motion: 0.020
  hud_stall_hard_restart_enabled: true
  hud_stall_hard_restart_recoveries: 4
  hud_stall_hard_restart_seconds: 28.0
  hard_restart_action_seconds: 0.75
  hard_restart_wait_seconds: 7.0
  hard_restart_progress_delta: 0.025

  # V9 HUD-backed road memory. V3's generic road grace is intentionally tiny; V9
  # can bridge a longer track-texture/shadow dropout only while the fixed race HUD is
  # strong and the scene still has meaningful motion. A stationary wall trap cannot
  # keep stale road ownership through this path.
  hud_road_memory_seconds: 0.85
  hud_road_memory_min_motion: 0.012

  # V9 smarter recovery. The first two recovery attempts can use the most recent
  # coherent road center to point the forward half of the maneuver back toward the
  # course. Later attempts return to V4/V8 alternating-side escalation.
  recovery_center_hint_seconds: 5.0
  recovery_center_hint_min_abs: 0.14
  recovery_center_hint_max_streak: 2

  # V9 terminal race escape. Restart Race remains preferred. Only two consecutive
  # restart attempts with no verified post-confirm visual progress arm Quit Race.
  # Quit Race uses the documented pause-menu order and then hands control back to the
  # unattended menu lifecycle. A cooldown prevents a runaway pause-menu loop.
  hard_quit_enabled: true
  hard_quit_after_restart_failures: 2
  hard_quit_action_seconds: 0.55
  hard_quit_wait_seconds: 8.0
  hard_quit_progress_delta: 0.025
  hard_quit_cooldown_seconds: 30.0

  # V10 liveness circuit breaker. The overnight V9 run accumulated 2,160 bounded
  # recoveries in one race because camera wiggle repeatedly reset the near-zero-motion
  # stall detector. Eight HUD-owned recovery starts inside two minutes now invoke the
  # existing verified Restart Race ladder regardless of those transient resets.
  recovery_storm_enabled: true
  recovery_storm_window_seconds: 120.0
  recovery_storm_limit: 8

  # V11 chase-camera safety. The road estimator now samples above the vehicle and
  # rejects overwide/reverse-perspective regions. During the remaining uncertainty,
  # launch steering follows coherent corridor geometry at bounded authority (without
  # first-frame braking), and moving gameplay continues straight instead of entering
  # repeated blind reverse maneuvers. A persistent blind scene restarts.
  launch_guard_seconds: 4.0
  launch_guard_max_steer: 0.36
  racing_max_steer: 0.62
  blind_motion_threshold: 0.012
  blind_steer_decay: 0.78
  blind_max_steer: 0.22
  blind_restart_seconds: 7.0

  # V9 broadcast pacing/showmanship. Replay holds cycle so every race does not have
  # identical presentation timing. Racer modes may make an occasional horn flourish
  # only on a clean, well-observed straight. Cop mode is excluded because Circle has
  # target/siren semantics there. Camera switching remains disabled for vision safety.
  broadcast_replay_variation_enabled: true
  broadcast_replay_holds:
    - 6.0
    - 10.0
    - 14.0
  showmanship_horn_enabled: true
  showmanship_horn_action: circle
  showmanship_horn_interval_seconds: 45.0
  showmanship_horn_warmup_seconds: 12.0
  showmanship_horn_min_road_confidence: 0.68
  showmanship_horn_max_steer: 0.22
  showmanship_horn_max_curvature: 0.10
  showmanship_horn_min_motion: 0.012
  # A horn flourish is entertainment, never evidence of health. Suppress it until
  # the controller has completed a full quiet minute without starting a recovery.
  showmanship_recovery_quiet_seconds: 60.0

  # One-shot lifecycle exits.
  results_hold_seconds: 5.0
  replay_hold_seconds: 8.0
  pause_resume_seconds: 1.5

  # HP2 arcade start: hold gas during a positively recognized countdown. The hold
  # is time-bounded so a stale countdown template cannot own throttle forever.
  countdown_preload_throttle: true
  countdown_preload_max_seconds: 6.0

  # Road perception / race entry.
  road_sample_width: 360
  road_color_distance: 42.0
  race_enter_confidence: 0.56
  drive_confidence: 0.34
  race_enter_frames: 5
  race_motion_threshold: 0.006
  road_loss_recovery_seconds: 2.2
  road_grace_seconds: 0.22

  # V6 live-evidence fast path. The first real V5 session produced isolated
  # 0.89-0.97 road-confidence locks but only reached two race-evidence frames, so a
  # very strong two-frame road lock can now take racing ownership without templates.
  strong_road_confidence: 0.82
  strong_road_enter_frames: 2

  # Base steering controller.
  steering_gain: 1.05
  curvature_gain: 0.72
  steering_smoothing: 0.42
  max_steer: 0.95

  # Predictive steering.
  steering_prediction_seconds: 0.18
  center_rate_gain: 1.00
  curvature_rate_gain: 0.75
  rate_smoothing: 0.58
  edge_correction_start: 0.62
  edge_correction_gain: 0.28

  # Speed management.
  corner_coast_threshold: 0.70
  low_confidence_coast_threshold: 0.44
  corner_brake_threshold: 0.86
  corner_brake_interval_seconds: 0.85

  # Oscillation and stuck-at-speed guards.
  oscillation_delta: 0.55
  oscillation_damping: 0.55
  stall_motion_threshold: 0.0025
  stall_seconds: 1.8

  # Near-field traffic/barricade perception. Telemetry is always produced, but
  # image-only steering remains opt-in until live PCSX2 footage proves it stable.
  hazard_sample_width: 360
  hazard_color_distance: 52.0
  obstacle_avoid_enabled: false
  hazard_confidence_threshold: 0.58
  hazard_proximity_threshold: 0.55
  hazard_steer_gain: 0.62
  hazard_steer_blend: 0.72
  hazard_coast_proximity: 0.66
  hazard_brake_proximity: 0.82
  hazard_emergency_brake: true

  # V5 temporal confirmation: if image-only avoidance is enabled, one candidate no
  # longer owns steering. It must persist spatially across several frames, then its
  # chosen pass side is held briefly so traffic jitter cannot create left/right weave.
  hazard_confirm_frames: 3
  hazard_center_tolerance: 0.28
  hazard_track_smoothing: 0.55
  hazard_release_seconds: 0.45
  hazard_avoid_hold_seconds: 0.75

  # Positive directional hazard templates are safer and enabled immediately. Name
  # captures with labels such as:
  #   nfs_race_hud_roadblock_avoid_left
  #   nfs_race_hud_spike_strip_avoid_right
  #   nfs_race_hud_helicopter_hazard_avoid_left
  template_hazard_avoid_enabled: true
  template_hazard_hold_seconds: 1.05
  template_hazard_strength: 0.72

  # V5 HP2 shortcut support is positive-template only. A local capture such as
  # nfs_race_hud_shortcut_enter_left latches a bounded line bias while the normal
  # predictive speed controller remains in charge of throttle/braking.
  shortcut_enabled: true
  shortcut_hold_seconds: 1.45
  shortcut_strength: 0.52
  shortcut_blend: 0.62
  shortcut_cooldown_seconds: 3.5

  # Hot Pursuit racer anti-ram ownership. Labels such as police_ram_left mean the
  # threat is on the left, so the policy evades right using the coast-first hazard
  # path. No unlabeled pursuit frame can trigger this maneuver.
  pursuit_evasion_enabled: true
  pursuit_evasion_hold_seconds: 0.85
  pursuit_evasion_strength: 0.72

  # Default PS2 bindings for Hot Pursuit 2.
  accelerate_action: cross
  brake_action: square
  handbrake_action: r1

  # R1 emergency brake remains implemented but disabled until live track evidence
  # proves that it helps on sharp bends rather than causing spins.
  handbrake_enabled: false
  handbrake_threshold: 0.93
  handbrake_curvature: 0.20
  handbrake_interval_seconds: 1.25

  # You're The Cop. Circle retargets when a calibrated HUD template explicitly says
  # a new target is needed. R2/L2 support remains opt-in and, by default, additionally
  # requires roadblock_ready/spike_strip_ready/helicopter_ready template evidence.
  cop_siren_action: circle
  cop_boost_action: r3
  cop_roadblock_action: r2
  cop_helicopter_action: l2
  cop_boost_interval_seconds: 4.0
  cop_target_refresh_seconds: 2.0
  cop_support_enabled: false
  cop_support_requires_template: true
  cop_support_interval_seconds: 18.0

  # Hot Pursuit racer failure flow. Generic BUSTED remains fail-closed; only a
  # busted_continue/busted_confirm template authorizes the one-shot Confirm.
  busted_hold_seconds: 3.5

  # Bounded recovery escalation. Repeated guardrail/wall traps alternate steering
  # side and modestly extend reverse/forward time instead of repeating one maneuver.
  recovery_reverse_seconds: 0.70
  recovery_forward_seconds: 0.85
  recovery_streak_window_seconds: 14.0
  recovery_streak_reset_seconds: 22.0
  recovery_duration_step: 0.22
  recovery_max_scale: 1.55
  recovery_early_exit_confidence: 0.58
